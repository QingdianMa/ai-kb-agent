services:
  postgres:
    # 自带 pgvector 扩展的官方镜像
    image: pgvector/pgvector:pg17
    container_name: kb-postgres
    environment:
      POSTGRES_DB: kb
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
    ports:
      - "5432:5432"
    volumes:
      - kb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Redis 用来缓存问题向量和做按 IP 限流。
  # 不启动也能跑（应用会在 2 秒超时后自动降级），但问答会慢一些。
  redis:
    image: redis:7-alpine
    container_name: kb-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - kb-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  kb-pgdata:
  kb-redis:
